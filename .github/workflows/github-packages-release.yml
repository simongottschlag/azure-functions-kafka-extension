name: Publish to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag name to publish (e.g. 4.1.0)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # needed for pushing to GitHub Packages

    steps:
      - name: Check out the specified tag
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.release_tag }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.x'

      - name: Build project
        run: |
          dotnet build src/Microsoft.Azure.WebJobs.Extensions.Kafka/Microsoft.Azure.WebJobs.Extensions.Kafka.csproj \
            --configuration Release \
            -p:IsLocalBuild=False

      - name: Create the package
        run: |
          dotnet pack src/Microsoft.Azure.WebJobs.Extensions.Kafka/Microsoft.Azure.WebJobs.Extensions.Kafka.csproj \
            --configuration Release \
            --output ./artifacts \
            --include-symbols \
            -p:PackageId="SimonGottschlag.Azure.WebJobs.Extensions.Kafka"

      - name: Publish the package to GitHub Packages
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source https://nuget.pkg.github.com/${{ github.repository_owner }} \
            --skip-duplicate
